{% extends 'task/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm p-4 text-center border-0 rounded-4">
            <div class="mb-3 text-danger fs-1">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            <h4 class="fw-bold mb-3">Удаление задачи</h4>
            <p class="text-secondary mb-4">Вы уверены, что хотите удалить задачу <br><strong class="text-dark">"{{ task.title }}"</strong>?</p>
            <form method="POST" class="d-flex justify-content-center gap-3">
                {% csrf_token %}
                <a href="{% url 'task_list' %}" class="btn btn-outline-secondary px-4">Отмена</a>
                <button type="submit" class="btn btn-danger px-4 shadow-sm">Да, удалить</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
