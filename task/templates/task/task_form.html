{% extends 'task/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4 border-0 rounded-4">
            <h4 class="mb-4 text-center fw-bold"><i class="bi bi-pencil-square"></i> Редактирование задачи</h4>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Название</label>
                    {{ form.title }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Описание</label>
                    {{ form.description }}
                </div>
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="{% url 'task_list' %}" class="btn btn-outline-secondary px-4 py-2">Отмена</a>
                    <button type="submit" class="btn btn-success px-4 py-2 fw-semibold shadow-sm">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
