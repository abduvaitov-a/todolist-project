<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 20px 0;">
<div class="container" style="max-width: 420px;">
    <div class="card p-4 shadow border-0 rounded-4">
        <h3 class="text-center mb-4 fw-bold"><i class="bi bi-person-plus"></i> Регистрация</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Имя пользователя</label>
                <input type="text" name="username" class="form-control py-2" placeholder="Придумайте логин" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Пароль</label>
                <input type="password" name="password1" class="form-control py-2" placeholder="Пароль" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Подтверждение пароля</label>
                <input type="password" name="password2" class="form-control py-2" placeholder="Повторите пароль" required>
            </div>
            {% if form.errors %}
                <div class="alert alert-danger p-2 small text-center">
                    Проверьте правильность введенных данных.
                </div>
            {% endif %}
            <button type="submit" class="btn btn-success w-100 py-2 mt-2 fw-semibold shadow-sm">Зарегистрироваться</button>
        </form>
        <hr class="my-4">
        <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100 py-2">Уже есть аккаунт? Войти</a>
    </div>
</div>
</body>
</html>
